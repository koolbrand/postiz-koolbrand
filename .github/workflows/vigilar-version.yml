# Cada mañana mira si Postiz ha publicado versión nueva. Si la hay, abre una
# issue con el enlace a las notas. NO actualiza solo: subir de versión es
# cambiar POSTIZ_VERSION (con revisión), porque algunas versiones piden
# servicios nuevos (según la plantilla de Railway, después de la v2.11.3 Postiz exige Temporal) o cambian la interfaz.
name: Vigilar versiones de Postiz
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actual=$(tr -d '[:space:]' < POSTIZ_VERSION)
          ultima=$(gh api repos/gitroomhq/postiz-app/releases/latest --jq .tag_name)
          echo "Fijada: $actual · Última: $ultima"
          [ "$actual" = "$ultima" ] && exit 0
          titulo="Postiz $ultima disponible (usamos $actual)"
          gh issue list --state open --search "$titulo in:title" --json number --jq 'length' | grep -q '^0$' || exit 0
          gh issue create --title "$titulo" --body "Notas: https://github.com/gitroomhq/postiz-app/releases/tag/$ultima

          La producción actual corre en el Mac mini (Colima), no en Coolify. Revisar si la versión pide servicios nuevos o cambia los nombres de las variables de color (colors.scss) y si los parches funcionales de permisos (marca/aprobacion.sh) siguen siendo válidos. Cambiar POSTIZ_VERSION y construir la imagen solo después de revisar las notas. No desplegar: el procedimiento de backup, validación en staging y rollback del Mac mini está pendiente de documentar."
