# Construye la imagen con la marca sobre la versión de Postiz fijada en POSTIZ_VERSION
# y la publica en ghcr.io/koolbrand/postiz-koolbrand:<versión>-kb y :latest-kb, para amd64 y arm64
# (el Mac mini es arm64).
name: Construir imagen con marca
on:
  push:
    branches: [main]
    paths: [POSTIZ_VERSION, Dockerfile, 'marca/**', '.github/workflows/construir.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < POSTIZ_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: POSTIZ_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/koolbrand/postiz-koolbrand:${{ steps.v.outputs.version }}-kb
            ghcr.io/koolbrand/postiz-koolbrand:latest-kb
