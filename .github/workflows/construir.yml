# Compila Postiz desde su fuente oficial fijada y añade el patch de Koolbrand.
name: Construir Postiz Koolbrand desde fuente
on:
  pull_request:
    paths: [POSTIZ_VERSION, POSTIZ_UPSTREAM_COMMIT, Dockerfile, 'patches/**', 'marca/**', 'oauth-gateway/**', '.github/workflows/construir.yml']
  push:
    branches: [main]
    paths: [POSTIZ_VERSION, POSTIZ_UPSTREAM_COMMIT, Dockerfile, 'patches/**', 'marca/**', 'oauth-gateway/**', '.github/workflows/construir.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(tr -d '[:space:]' < POSTIZ_VERSION)" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$(tr -d '[:space:]' < POSTIZ_UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            POSTIZ_VERSION=${{ steps.v.outputs.version }}
            POSTIZ_UPSTREAM_COMMIT=${{ steps.v.outputs.upstream_commit }}
            NEXT_PUBLIC_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=postiz-source-build
          cache-to: type=gha,mode=max,scope=postiz-source-build
          tags: |
            ghcr.io/koolbrand/postiz-koolbrand:${{ steps.v.outputs.version }}-kb
            ghcr.io/koolbrand/postiz-koolbrand:latest-kb
